x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__BASE_URL: 'http://localhost:8080'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__WEBSERVER__SECRET_KEY: 'dev_secure_key_123'
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - bionic_net

services:
  postgres:
    image: postgres:16
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./airflow/db:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    networks:
      - bionic_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airflow" ]
      interval: 10s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.5
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ch-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: bionic_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse_pass
    networks:
      - bionic_net
    healthcheck:
      test: [ "CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1" ]
      interval: 10s
      retries: 5

  airflow-init:
    <<: *airflow-common
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/requirements.txt:/opt/airflow/requirements.txt:ro
      - ./airflow/scripts:/opt/airflow/scripts:ro
    command: bash /opt/airflow/scripts/init-airflow.sh
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/requirements.txt:/opt/airflow/requirements.txt:ro
    ports:
      - "8081:8080"
    command: webserver
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/requirements.txt:/opt/airflow/requirements.txt:ro
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME} || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  reverse-proxy:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/ssl:ro
    networks:
      - bionic_net
    depends_on:
      - frontend
      - bionicpro-auth
      - reports

  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    networks:
      - bionic_net
    ports:
      - "5433:5432"

  keycloak:
    image: playaru/keycloak-russian:21.1.1
    dns:
      - 77.88.8.8
      - 77.88.8.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      TZ: Europe/Saratov
      JAVA_OPTS_APPEND: -Djava.net.preferIPv4Stack=true
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - bionic_net
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - bionic_net
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: https://localhost
      REACT_APP_KEYCLOAK_URL: http://localhost:8080
      REACT_APP_KEYCLOAK_REALM: reports-realm
      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    networks:
      - bionic_net
    ports:
      - "8000:8000"
    environment:
      - ENV=prod
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=reports-realm
      - CLIENT_ID=reports-frontend
      - CLIENT_SECRET=
      - AUTH_CALLBACK_URL=https://localhost/auth/callback
      - FRONTEND_URL=https://localhost
      - FERNET_KEY=pjI9yfcQhvG-H1iypQbGTG-ciM870QarSpL0klBXDdY=
    depends_on:
      - keycloak

  reports:
    build:
      context: ./reports
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    networks:
      - bionic_net
    environment:
      - ENV=prod
      - FRONTEND_URL=https://localhost
      - REDIS_URL=redis://redis:6379/0
      - SESSION_COOKIE=bionic_session
      - FERNET_KEY=pjI9yfcQhvG-H1iypQbGTG-ciM870QarSpL0klBXDdY=
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_DB=bionic_analytics
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse_pass
    depends_on:
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    networks:
      - bionic_net
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 5

  openldap:
    image: osixia/openldap:1.5.0
    container_name: bionicpro-openldap
    networks:
      - bionic_net
    ports:
      - "389:389"
    environment:
      - LDAP_ORGANISATION=BionicPRO
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=admin
      - LDAP_CONFIG_PASSWORD=admin
      - LDAP_TLS=false
    volumes:
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/config.ldif
    command: --copy-service

networks:
  bionic_net:

volumes:
  pg-data:
  ch-data:
  openldap_data:
  openldap_config:
