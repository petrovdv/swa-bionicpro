# Зона кеширования: 10 МБ под ключи, 500 МБ под тела файлов, TTL неактивных объектов — 1 час
proxy_cache_path /var/cache/nginx/cdn
    levels=1:2
    keys_zone=cdn_cache:10m
    max_size=500m
    inactive=1h
    use_temp_path=off;

server {
    listen 80;
    server_name localhost;
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://bionicpro-auth:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /reports/ {
        proxy_pass http://reports:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CDN-прокси к MinIO.
    # URL-схема: /cdn/reports/{email}/{YYYY-MM-DD}.pdf
    # Дата в имени файла — основной механизм «инвалидации»: новый день = новый URL = cache miss.
    # Nginx при этом хранит старые файлы не дольше inactive=1h.
    location /cdn/ {
        # Убираем префикс /cdn/ перед проксированием в MinIO
        rewrite ^/cdn/(.*)$ /reports/$1 break;
        proxy_pass http://minio:9000;

        proxy_http_version 1.1;
        proxy_set_header Host       minio:9000;
        proxy_set_header Connection "";

        # Кешируем только успешные ответы
        proxy_cache            cdn_cache;
        proxy_cache_key        "$uri";
        proxy_cache_valid      200 1h;
        proxy_cache_use_stale  error timeout updating;

        # Клиент может кешировать у себя 1 час
        add_header Cache-Control   "public, max-age=3600, immutable";
        add_header X-Cache-Status  $upstream_cache_status;

        # Не пробрасываем авторизацию MinIO клиенту
        proxy_hide_header Authorization;
    }
}